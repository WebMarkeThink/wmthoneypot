name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sintassi PHP
        run: find services src -name '*.php' -print0 | xargs -0 -n1 php -l

      # Con PHP invece di xmllint: è già installato sui runner ed è lo stesso
      # interprete che leggerà questi XML su Joomla.
      - name: XML ben formati
        run: |
          for f in wmthoneypot.xml hpupdates.xml changelog.xml; do
            php -r '
              libxml_use_internal_errors(true);
              $doc = new DOMDocument();
              if (!$doc->load($argv[1])) {
                foreach (libxml_get_errors() as $e) { fwrite(STDERR, $argv[1] . ": " . trim($e->message) . "\n"); }
                exit(1);
              }
              echo "ok  " . $argv[1] . "\n";
            ' "$f"
          done

      - name: Struttura, versioni e coerenza
        run: node scripts/validate.mjs

      - name: Il pacchetto si costruisce
        run: |
          node scripts/build.mjs
          git diff --exit-code hpupdates.xml \
            || (echo "hpupdates.xml non è allineato: esegui 'npm run build' e committa" && exit 1)
