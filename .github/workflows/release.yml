name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sintassi PHP
        run: find services src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Il tag corrisponde al manifest
        run: node scripts/validate.mjs "${GITHUB_REF_NAME}"

      - name: Costruisci il pacchetto
        run: node scripts/build.mjs

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.zip dist/*.sha256 \
            --title "${GITHUB_REF_NAME}" \
            --notes-file <(node -e "
              const fs = require('fs');
              const v = process.env.GITHUB_REF_NAME.replace(/^v/, '');
              const md = fs.readFileSync('CHANGELOG.md', 'utf8');
              const block = md.split(/^## /m).find((s) => s.startsWith(v));
              process.stdout.write(block ? '## ' + block.trim() : 'Vedi CHANGELOG.md');
            ")
