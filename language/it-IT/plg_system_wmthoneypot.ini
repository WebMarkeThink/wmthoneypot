PLG_SYSTEM_WMTHONEYPOT="Sistema - WMT Honeypot anti-spam"
PLG_SYSTEM_WMTHONEYPOT_XML_DESCRIPTION="Blocca gli invii automatici dei moduli di contatto senza captcha e senza servizi esterni: aggiunge un campo esca fuori schermo e controlla il tempo trascorso dall'apertura del modulo."
PLG_SYSTEM_WMTHONEYPOT_ADVANCED="Avanzate"

PLG_SYSTEM_WMTHONEYPOT_FIELD_LABEL="Lascia vuoto questo campo"
PLG_SYSTEM_WMTHONEYPOT_FIELD_DESC="Serve a bloccare gli invii automatici: se stai leggendo questa frase, non scrivere nulla qui."
PLG_SYSTEM_WMTHONEYPOT_REJECTED="Non è stato possibile inviare il messaggio. Riprova, oppure contattaci per un'altra via."

PLG_SYSTEM_WMTHONEYPOT_FIELD_NAME_LABEL="Nome del campo esca"
PLG_SYSTEM_WMTHONEYPOT_FIELD_NAME_DESC="Solo lettere minuscole, numeri e trattino basso. Cambiarlo su ogni sito rende inefficaci i bot tarati sul nome predefinito."
PLG_SYSTEM_WMTHONEYPOT_MIN_SECONDS_LABEL="Tempo minimo di compilazione (secondi)"
PLG_SYSTEM_WMTHONEYPOT_MIN_SECONDS_DESC="Un modulo inviato prima di questo tempo viene considerato automatico. 4 secondi è un valore prudente: una persona non fa in tempo a compilarlo."
PLG_SYSTEM_WMTHONEYPOT_MAX_HOURS_LABEL="Validità del modulo (ore)"
PLG_SYSTEM_WMTHONEYPOT_MAX_HOURS_DESC="Dopo questo tempo dall'apertura della pagina l'invio viene rifiutato, per evitare invii ripetuti da moduli raccolti in precedenza. Se il sito usa una cache delle pagine molto lunga, alzare questo valore."
PLG_SYSTEM_WMTHONEYPOT_LOG_LABEL="Registra i blocchi"
PLG_SYSTEM_WMTHONEYPOT_LOG_DESC="Scrive gli invii bloccati nel file wmthoneypot.log.php, senza salvare dati personali. Utile per capire se il filtro sta funzionando."
PLG_SYSTEM_WMTHONEYPOT_FORMS_LABEL="Moduli da proteggere"
PLG_SYSTEM_WMTHONEYPOT_FORMS_DESC="Un contesto per riga. Il controllo in fase di invio è attivo sul modulo Contatti del core (com_contact.contact)."
PLG_SYSTEM_WMTHONEYPOT_MESSAGE_LABEL="Messaggio di rifiuto"
PLG_SYSTEM_WMTHONEYPOT_MESSAGE_DESC="Lascia vuoto per usare il messaggio predefinito. Su un sito con un indirizzo email alternativo conviene indicarlo qui."
